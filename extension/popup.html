<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0B132B;
      color: #F1F5F9;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1C2541;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 15px;
      color: #FFF;
    }
    .brand span { color: #00B4D8; }
    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(6, 214, 160, 0.2);
      color: #06D6A0;
      border: 1px solid rgba(6, 214, 160, 0.4);
    }
    .status-card {
      background: #1C2541;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .status-title {
      font-size: 12px;
      font-weight: 700;
      color: #00B4D8;
      margin-bottom: 4px;
    }
    .status-desc {
      font-size: 11px;
      color: #94A3B8;
      line-height: 1.4;
    }
    .history-title {
      font-size: 11px;
      font-weight: 700;
      color: #94A3B8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .history-list {
      max-height: 140px;
      overflow-y: auto;
      font-size: 11px;
      margin-bottom: 12px;
    }
    .history-item {
      padding: 6px 8px;
      border-radius: 6px;
      background: #151D33;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .history-item span {
      font-weight: 600;
      color: #EF476F;
    }
    .btn-clear {
      width: 100%;
      background: #1C2541;
      border: 1px solid #3A506B;
      color: #CBD5E1;
      padding: 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-clear:hover {
      background: #243356;
      color: #FFF;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span>🛡️</span> ScamShield <span>AI</span>
    </div>
    <div class="badge">ACTIVE</div>
  </div>

  <div class="status-card">
    <div class="status-title">Automatic Navigation Protection</div>
    <div class="status-desc">
      Inspects URLs before page load and detects deceptive credential phishing forms with <strong>zero manual input</strong>.
    </div>
  </div>

  <div class="history-title">Recently Blocked Threats</div>
  <div class="history-list" id="threat-list">
    <div style="color: #64748B; padding: 12px; text-align: center;">No active threats detected.</div>
  </div>

  <button class="btn-clear" id="btn-clear-history">Clear History</button>

  <script src="popup.js"></script>
</body>
</html>
